# Pinned 2026-09-26, all verified against live Maven metadata.
# Kotlin 2.2.21: latest 2.2.x stable. AGP 8.13.2: latest 8.x (Gradle 9 needs
# AGP 9, so the 8.x line + Gradle 8.14.5 is the conservative pair).
# Compose BOM 2025.08.00 (compose 1.9.0, material3 1.3.2): the newest BOM
# whose AARs do NOT force compileSdk 37. BOM 2026.09.00 pulls compose 1.12.1
# (minCompileSdk 37); activity-compose 1.13.0 needs minCompileSdk 36, so
# compileSdk is 36, the newest platform on the ops host. Revisit when the
# host SDK gains API 37: then take the latest BOM + compileSdk 37.
[versions]
billing = "8.3.0"
kotlin = "2.2.21"
serialization = "1.8.1"
agp = "8.13.2"
composeBom = "2025.08.00"
activityCompose = "1.13.0"
compileSdk = "36"
minSdk = "26"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
play-billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
androidx-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
sentry-android = { group = "io.sentry", name = "sentry-android", version = "8.58.0" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
