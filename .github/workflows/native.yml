name: Native and web

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'build/**']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 "${{ github.workspace }}/scripts/verify-ios-metadata.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check native content matches web
        run: npm run native:content -- --check
      - name: Verify desktop uses this checkout
        run: node apps/native/scripts/fetch-web.mjs steam
  android:
    name: Native tests and Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :androidApp:assembleDebug --no-daemon --max-workers=2
  ios:
    name: iOS simulator launch
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/native
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          xcodebuild -project iosApp/MOVGameiOS.xcodeproj
          -scheme MOVGameiOS -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/mov-derived"
          CODE_SIGNING_ALLOWED=NO build
      - name: Launch app on iPhone simulator
        run: python3 ../../scripts/ios-launch-smoke.py "$RUNNER_TEMP/mov-derived/Build/Products/Release-iphonesimulator/MOVGameiOS.app" "$RUNNER_TEMP/mov-launch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-launch
          path: ${{ runner.temp }}/mov-launch
