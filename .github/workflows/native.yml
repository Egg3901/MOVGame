name: Native and web

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'build/**']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 "${{ github.workspace }}/scripts/verify-ios-metadata.py"
      - run: python3 "${{ github.workspace }}/scripts/test-ios-screen-ready.py"
      - run: python3 "${{ github.workspace }}/scripts/test-ios-simulator-control.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check native content matches web
        run: npm run native:content -- --check
      - name: Check native plan vectors match web
        run: npx tsx apps/native/scripts/export-plan-vectors.ts --check
      - name: Check complete native campaign vectors match web
        run: npx tsx apps/native/scripts/export-campaign-vectors.ts --check
      - name: Check web save interchange fixture
        run: npx tsx apps/native/scripts/export-save-vector.ts --check
      - name: Check interactive debate answers match web
        run: npx tsx apps/native/scripts/export-debate-vectors.ts --check
      - name: Check native replay logs and reports match web
        run: npx tsx apps/native/scripts/export-replay-vectors.ts --check
      - name: Check native election-night allocations and schedules
        run: npx tsx apps/native/scripts/export-reveal-vectors.ts --check
      - run: npx tsx apps/native/scripts/export-daily-percentiles.ts --check
      - name: Verify desktop uses this checkout
        run: node apps/native/scripts/fetch-web.mjs steam
  android:
    name: Native tests and Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :androidApp:assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: mov-android-debug
          path: apps/native/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
  ios:
    name: iOS simulator launch
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/native
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: >-
          xcodebuild -project iosApp/MOVGameiOS.xcodeproj
          -scheme MOVGameiOS -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/mov-derived"
          CODE_SIGNING_ALLOWED=NO build
      - name: Verify packaged campaign content
        run: python3 ../../scripts/verify-ios-bundles.py "$RUNNER_TEMP/mov-derived/Build/Products/Release-iphonesimulator/MOVGameiOS.app"
      - name: Package unsigned simulator app for runtime compatibility testing
        run: tar -C "$RUNNER_TEMP/mov-derived/Build/Products/Release-iphonesimulator" -czf "$RUNNER_TEMP/mov-simulator.tar.gz" MOVGameiOS.app
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-simulator-app
          path: ${{ runner.temp }}/mov-simulator.tar.gz
          retention-days: 3
      - name: Launch app on iPhone simulator
        env:
          MOV_CAPTURE_SCREENS: '1'
          MOV_FRESH_SIMULATOR: '1'
        run: python3 ../../scripts/ios-launch-smoke.py "$RUNNER_TEMP/mov-derived/Build/Products/Release-iphonesimulator/MOVGameiOS.app" "$RUNNER_TEMP/mov-launch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-launch
          path: ${{ runner.temp }}/mov-launch
  ios27:
    name: iOS 27 iPhone 17 Pro Max launch
    needs: ios
    if: ${{ always() && needs.ios.result != 'cancelled' }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-ios-simulator-app
          path: ${{ runner.temp }}/mov-compat
      - name: Launch existing Release binary on iOS 27
        env:
          MOV_CAPTURE_SCREENS: '1'
        run: |
          tar -xzf "$RUNNER_TEMP/mov-compat/mov-simulator.tar.gz" -C "$RUNNER_TEMP/mov-compat"
          SIMULATOR_UDID=$(xcrun simctl create 'iPhone 17 Pro Max MOV' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          export SIMULATOR_UDID
          python3 scripts/ios-launch-smoke.py "$RUNNER_TEMP/mov-compat/MOVGameiOS.app" "$RUNNER_TEMP/mov-ios27-launch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios27-simulator-launch
          path: ${{ runner.temp }}/mov-ios27-launch
