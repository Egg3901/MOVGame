# KMP scaffold CI: Android builds on Linux, iOS builds on macOS.
# Desktop (Tauri) CI is separate and untouched by this workflow.
name: kmp

on:
  push:
    branches: [main, development, staging]
    paths:
      - shared/**
      - androidApp/**
      - iosApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/kmp.yml
  pull_request:
    paths:
      - shared/**
      - androidApp/**
      - iosApp/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - .github/workflows/kmp.yml

jobs:
  android:
    name: shared tests + Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run shared contract tests and assemble debug
        run: ./gradlew :shared:jvmTest :androidApp:assembleDebug --stacktrace

  ios:
    name: iOS native build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI app in the simulator SDK
        run: >
          xcodebuild
          -project iosApp/MOVGameiOS.xcodeproj
          -scheme MOVGameiOS
          -destination 'platform=iOS Simulator,name=iPhone 16'
          build
