[package]
name = "electioneer"
version = "0.1.0"
description = "Margin of Victory desktop shell (Tauri)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "electioneer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
